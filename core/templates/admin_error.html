<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Error - STEM Voice Tutor</title>
    <link rel="stylesheet" href="/static/theme.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-6);
        }

        .error-container {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            padding: var(--space-10);
            text-align: center;
            max-width: 560px;
            animation: fadeSlideUp var(--duration-slow) var(--ease-out) both;
        }

        .error-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto var(--space-5);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-danger-bg);
            border-radius: var(--radius-full);
            color: var(--color-danger);
        }
        .error-icon .icon { width: 28px; height: 28px; }

        .error-title { font-size: var(--text-xl); color: var(--color-text); margin-bottom: var(--space-4); }

        .error-message {
            color: var(--color-text-secondary);
            margin-bottom: var(--space-6);
            padding: var(--space-4);
            background: var(--color-surface-alt);
            border-radius: var(--radius-md);
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            text-align: left;
            word-break: break-word;
        }

        .actions { display: flex; gap: var(--space-3); justify-content: center; }
    </style>
</head>
<body>
    <svg style="display:none" aria-hidden="true">
      <symbol id="icon-alert-triangle" viewBox="0 0 24 24"><path d="M12 3.5 21.5 20h-19L12 3.5z"/><line x1="12" y1="9.5" x2="12" y2="14"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/></symbol>
    </svg>
    <div class="error-container">
        <div class="error-icon"><svg class="icon"><use href="#icon-alert-triangle"/></svg></div>
        <h1 class="error-title">Admin Error</h1>
        <div class="error-message">{{ error }}</div>
        <div class="actions">
            <a href="/admin" class="btn btn-primary">Try Again</a>
            <a href="/" class="btn btn-secondary">Back to Tutor</a>
        </div>
    </div>
</body>
</html>
