grade_instruction: "A criança está no {grade}º ano, com cerca de {age} anos. Use palavras, ideias e exemplos que uma criança dessa idade conhece: bem simples para as mais novas, e com palavras científicas de verdade para as mais velhas. Não mencione o ano nem a idade dela."

no_answer_generated: "Estou com um pouco de dificuldade para pensar em uma resposta agora. Você pode tentar de novo daqui a pouco?"
answer_generation_error: "Ops, algo deu errado enquanto eu pensava sobre isso. Você pode tentar de novo?"
voice_retry_prompt: "Não entendi bem. Você pode tentar perguntar de novo?"
voice_error_prompt: "Desculpe, algo deu errado enquanto eu pensava. Você pode tentar de novo?"
sources_label: "Fontes"
source_line: "[Fonte {id}] Documento {document_id} - {url}"
truncated_notice: "[...truncado para melhorar o desempenho...]"

# Dá ao tutor uma memória de curto prazo das rodadas anteriores da mesma
# sessão, para que perguntas de acompanhamento como "como isso funciona?"
# sejam entendidas corretamente. Omitido completamente do prompt quando
# não há rodada anterior.
conversation_history_label: "CONVERSA ATÉ AGORA"
conversation_learner_label: "Aluno"
conversation_tutor_label: "Sparky"

# Spoken forms for fractions, so the voice says "one half" instead of
# "one slash two". Anything not listed uses speech_fraction_template.
speech_fractions:
  "1/2": "meio"
  "1/3": "um terço"
  "2/3": "dois terços"
  "1/4": "um quarto"
  "3/4": "três quartos"
speech_fraction_template: "{numerator} sobre {denominator}"

refusal_pattern: "(Não posso|Eu não posso|Não consigo) (fornecer|ajudar|dar|responder|compartilhar)"
safety_redirect: "Isso parece algo que pode ser muito perigoso, então, por favor, não tente fazer isso e converse com um adulto em quem você confia. Há muita ciência emocionante que podemos explorar juntos com segurança. Sobre o que mais você tem curiosidade?"

# Maths helper (core/services/maths_helper.py): sums in the child's message are
# worked out exactly in code and added to the prompt, because small models get
# arithmetic wrong. {fact} is e.g. "1/2 + 1/4 = 3/4 (= 0.75)". maths_check_note
# is used when the child answers the previous sum ("I got two sixths").
maths_note: "FATO DE MATEMÁTICA (calculado com exatidão, confie nele e não recalcule): {fact}. Explique de forma simples como se chega a esse resultado."
maths_check_note: "VERIFICAÇÃO (calculada com exatidão): a resposta da criança é {child}; a resposta certa para {expr} é {answer}. A criança {verdict}. Diga isso com carinho e ajude-a a entender porquê."
maths_correct: "acertou"
maths_incorrect: "ainda não acertou"
