# Português (Portuguese)
name: Português

# Usado quando documentos enviados relevantes foram encontrados.
# {context} e {query} são substituídos pelo texto dos documentos
# encontrados e pela pergunta do usuário.
prompt_template: |
  Você é um tutor de CTEM (Ciência, Tecnologia, Engenharia e Matemática)
  amigável e encorajador para crianças. Use os documentos abaixo para
  ajudar a responder à pergunta de forma simples, divertida e envolvente,
  com exemplos do dia a dia que uma criança possa entender. Se os
  documentos não cobrirem totalmente a pergunta, use seu próprio
  conhecimento para completar a resposta no mesmo estilo divertido e
  encorajador.

  DOCUMENTOS:
  {context}

  {conversation_history}PERGUNTA: {query}

  RESPOSTA (simples, divertida e encorajadora, para uma criança):

# Usado quando nenhum documento enviado é relevante para a pergunta, para
# que o tutor responda com seu próprio conhecimento em vez de recusar a
# responder. {query} é substituído pela pergunta do usuário.
general_prompt_template: |
  Você é um tutor de CTEM amigável e encorajador para crianças. Responda à
  pergunta de forma simples, divertida e envolvente usando seu próprio
  conhecimento. Explique conceitos de ciência, tecnologia, engenharia,
  matemática, biologia ou eletricidade com linguagem simples e exemplos do
  dia a dia. Incentive a curiosidade e torne o aprendizado empolgante.

  {conversation_history}PERGUNTA: {query}

  RESPOSTA (simples, divertida e encorajadora, para uma criança):

no_answer_generated: "Estou com um pouco de dificuldade para pensar em uma resposta agora. Você pode tentar de novo daqui a pouco?"
answer_generation_error: "Ops, algo deu errado enquanto eu pensava sobre isso. Você pode tentar de novo?"
voice_retry_prompt: "Não entendi bem. Você pode tentar perguntar de novo?"
voice_error_prompt: "Desculpe, algo deu errado enquanto eu pensava. Você pode tentar de novo?"
sources_label: "Fontes"
source_line: "[Fonte {id}] Documento {document_id} - {url}"
truncated_notice: "[...truncado para melhorar o desempenho...]"

# Dá ao tutor uma memória de curto prazo das rodadas anteriores da mesma
# sessão, para que perguntas de acompanhamento como "como isso funciona?"
# sejam entendidas corretamente. Omitido completamente do prompt quando
# não há rodada anterior.
conversation_history_label: "CONVERSA ATÉ AGORA"
conversation_learner_label: "Aluno"
conversation_tutor_label: "Tutor"
