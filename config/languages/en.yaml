# Filled into {grade_instruction} when a learner grade is set in the admin
# dashboard. {grade} is the grade number.
grade_instruction: "The child is in Grade {grade}, about {age} years old. Use words, ideas and examples a child of that age knows: keep it very simple for young children, and go deeper with proper science words for older ones. Do not mention their grade or age."

no_answer_generated: "I'm having a little trouble coming up with an answer right now. Can you try asking again in a moment?"
answer_generation_error: "Oops, something went wrong while I was thinking about that. Can you try asking again?"
voice_retry_prompt: "I didn't quite catch that. Can you try asking again?"
voice_error_prompt: "Sorry, something went wrong while I was thinking. Can you try again?"
sources_label: "Sources"
source_line: "[Source {id}] Document {document_id} - {url}"
truncated_notice: "[...truncated for performance...]"

# Used to give the tutor short-term memory of earlier turns in the same
# session, so follow-up questions like "how does that work?" resolve
# correctly. Left out of the prompt entirely when there's no prior turn.
conversation_history_label: "CONVERSATION SO FAR"
conversation_learner_label: "Learner"
conversation_tutor_label: "Sparky"

# Spoken forms for fractions, so the voice says "one half" instead of
# "one slash two". Anything not listed uses speech_fraction_template.
speech_fractions:
  "1/2": "one half"
  "1/3": "one third"
  "2/3": "two thirds"
  "1/4": "a quarter"
  "3/4": "three quarters"
speech_fraction_template: "{numerator} over {denominator}"

# The model sometimes answers risky questions with a flat canned refusal
# ("I cannot provide information on..."). Answers matching refusal_pattern
# (a regex, checked at the start of the answer) are replaced with
# safety_redirect, so Sparky never just refuses.
refusal_pattern: "I (cannot|can't|can not|won't|am not able to|'m not able to) (provide|help(?! but)|assist|give|offer|share|answer|fulfil)"
safety_redirect: "That sounds like something that could be really dangerous, so please don't try it, and talk to a grown-up you trust about it. There's lots of exciting science we can explore safely together. What else are you curious about?"

# Maths helper (core/services/maths_helper.py): sums in the child's message are
# worked out exactly in code and added to the prompt, because small models get
# arithmetic wrong. {fact} is e.g. "1/2 + 1/4 = 3/4 (= 0.75)". maths_check_note
# is used when the child answers the previous sum ("I got two sixths").
maths_note: "MATHS FACT (worked out exactly, so trust it and do not work it out yourself): {fact}. Explain simply how to get this answer."
maths_check_note: "MATHS CHECK (worked out exactly): the child's answer is {child}; the right answer to {expr} is {answer}. The child is {verdict}. Tell them kindly and help them see why."
maths_correct: "right"
maths_incorrect: "not right yet"

# Number, fraction and operator words the maths helper understands. Digits and
# + - * / x always work, so other languages can leave this out.
maths_words:
  numbers: {a: 1, zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7,
    eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14,
    fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19, twenty: 20,
    thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90,
    hundred: 100, thousand: 1000}
  denominators: {half: 2, halves: 2, third: 3, thirds: 3, quarter: 4, quarters: 4,
    fourth: 4, fourths: 4, fifth: 5, fifths: 5, sixth: 6, sixths: 6, seventh: 7,
    sevenths: 7, eighth: 8, eighths: 8, ninth: 9, ninths: 9, tenth: 10, tenths: 10,
    twelfth: 12, twelfths: 12, hundredth: 100, hundredths: 100}
  operators: {plus: "+", minus: "-", times: "*"}
  operator_phrases: {"divided by": "/", "multiplied by": "*", "take away": "-"}
  joiners: [and]
