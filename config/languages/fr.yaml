grade_instruction: "L'enfant est en classe de niveau {grade} et a environ {age} ans. Utilise des mots, des idées et des exemples qu'un enfant de cet âge connaît : très simples pour les plus jeunes, et avec de vrais mots scientifiques pour les plus grands. Ne mentionne ni sa classe ni son âge."

no_answer_generated: "J'ai un peu de mal à trouver une réponse en ce moment. Peux-tu réessayer dans un instant ?"
answer_generation_error: "Oups, quelque chose s'est mal passé pendant que j'y réfléchissais. Peux-tu réessayer ?"
voice_retry_prompt: "Je n'ai pas bien compris. Peux-tu réessayer ?"
voice_error_prompt: "Désolé, quelque chose s'est mal passé pendant que je réfléchissais. Peux-tu réessayer ?"
sources_label: "Sources"
source_line: "[Source {id}] Document {document_id} - {url}"
truncated_notice: "[...tronqué pour améliorer la performance...]"

# Donne au tuteur une mémoire à court terme des échanges précédents dans la
# même session, pour que les questions de suivi comme "comment ça marche ?"
# soient bien comprises. Complètement omis du prompt s'il n'y a pas
# d'échange précédent.
conversation_history_label: "CONVERSATION JUSQU'ICI"
conversation_learner_label: "Élève"
conversation_tutor_label: "Sparky"

# Spoken forms for fractions, so the voice says "one half" instead of
# "one slash two". Anything not listed uses speech_fraction_template.
speech_fractions:
  "1/2": "un demi"
  "1/3": "un tiers"
  "2/3": "deux tiers"
  "1/4": "un quart"
  "3/4": "trois quarts"
speech_fraction_template: "{numerator} sur {denominator}"

refusal_pattern: "Je ne (peux|suis pas en mesure de) (pas )?(fournir|t'aider|vous aider|aider|donner|répondre)"
# Experiment sheets mark their most important safety line with this; the tutor always
# adds that line to an answer based on the sheet (see _must_say in simple_rag_service.py)
must_say_marker: "Sparky dit toujours :"
safety_redirect: "Ça a l'air de quelque chose qui pourrait être vraiment dangereux, alors s'il te plaît, n'essaie pas, et parles-en à un adulte de confiance. Il y a plein de sciences passionnantes que nous pouvons explorer ensemble en toute sécurité. Qu'est-ce qui t'intéresse d'autre ?"

# Maths helper (core/services/maths_helper.py): sums in the child's message are
# worked out exactly in code and added to the prompt, because small models get
# arithmetic wrong. {fact} is e.g. "1/2 + 1/4 = 3/4 (= 0.75)". maths_check_note
# is used when the child answers the previous sum ("I got two sixths").
maths_note: "FAIT MATHÉMATIQUE (calculé exactement, fais-lui confiance et ne recalcule pas) : {fact}. Explique simplement comment on trouve ce résultat."
maths_check_note: "VÉRIFICATION (calculée exactement) : la réponse de l'enfant est {child} ; la bonne réponse à {expr} est {answer}. L'enfant {verdict}. Dis-le-lui gentiment et aide-le à comprendre pourquoi."
maths_correct: "a raison"
maths_incorrect: "n'a pas encore la bonne réponse"
