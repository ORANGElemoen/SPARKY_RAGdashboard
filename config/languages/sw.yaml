grade_instruction: "Mtoto yuko darasa la {grade}, mwenye umri wa takriban miaka {age}. Tumia maneno, mawazo na mifano ambayo mtoto wa umri huo anaijua: rahisi sana kwa watoto wadogo, na maneno halisi ya kisayansi kwa wakubwa. Usitaje darasa wala umri wake."

no_answer_generated: "Ninapata shida kidogo kupata jibu sasa hivi. Unaweza kujaribu tena baada ya muda mfupi?"
answer_generation_error: "Samahani, kuna tatizo lililotokea nilipokuwa nikifikiri kuhusu hilo. Unaweza kujaribu tena?"
voice_retry_prompt: "Sikuelewa vizuri. Unaweza kujaribu kuuliza tena?"
voice_error_prompt: "Samahani, kuna tatizo lililotokea nilipokuwa nikifikiri. Unaweza kujaribu tena?"
sources_label: "Vyanzo"
source_line: "[Chanzo {id}] Hati {document_id} - {url}"
truncated_notice: "[...imepunguzwa kwa ajili ya utendaji bora...]"

# Humpa mwalimu kumbukumbu ya muda mfupi ya mazungumzo yaliyopita katika
# kikao kimoja, ili maswali ya ufuatiliaji kama "hiyo inafanyaje kazi?"
# yaeleweke vizuri. Huachwa kabisa kwenye prompt ikiwa hakuna mazungumzo
# ya awali.
conversation_history_label: "MAZUNGUMZO HADI SASA"
conversation_learner_label: "Mwanafunzi"
conversation_tutor_label: "Sparky"

# Spoken forms for fractions, so the voice says "one half" instead of
# "one slash two". Anything not listed uses speech_fraction_template.
speech_fractions:
  "1/2": "nusu"
  "1/3": "theluthi moja"
  "2/3": "theluthi mbili"
  "1/4": "robo"
  "3/4": "robo tatu"
speech_fraction_template: "{numerator} kwa {denominator}"

refusal_pattern: "(Siwezi|Mimi siwezi) (kutoa|kusaidia|kujibu|kukupa)"
safety_redirect: "Hilo linaonekana kuwa jambo linaloweza kuwa hatari sana, kwa hiyo tafadhali usilijaribu, na zungumza na mtu mzima unayemwamini kuhusu hilo. Kuna sayansi nyingi ya kusisimua tunayoweza kuchunguza pamoja kwa usalama. Una hamu ya kujua nini kingine?"

# Maths helper (core/services/maths_helper.py): sums in the child's message are
# worked out exactly in code and added to the prompt, because small models get
# arithmetic wrong. {fact} is e.g. "1/2 + 1/4 = 3/4 (= 0.75)". maths_check_note
# is used when the child answers the previous sum ("I got two sixths").
maths_note: "UKWELI WA HESABU (umehesabiwa kwa usahihi, uamini na usihesabu upya): {fact}. Eleza kwa urahisi jinsi ya kupata jibu hili."
maths_check_note: "UKAGUZI WA HESABU (umehesabiwa kwa usahihi): jibu la mtoto ni {child}; jibu sahihi la {expr} ni {answer}. Mtoto {verdict}. Mwambie kwa upole na umsaidie kuelewa kwa nini."
maths_correct: "yuko sahihi"
maths_incorrect: "bado hajapata jibu sahihi"
