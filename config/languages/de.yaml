grade_instruction: "Das Kind ist in Klasse {grade}, etwa {age} Jahre alt. Verwende Wörter, Ideen und Beispiele, die ein Kind in diesem Alter kennt: sehr einfach für jüngere Kinder, und mit richtigen Fachwörtern für ältere. Erwähne weder die Klasse noch das Alter."

no_answer_generated: "Ich habe gerade etwas Mühe, eine Antwort zu finden. Kannst du es gleich nochmal versuchen?"
answer_generation_error: "Hoppla, da ist etwas schiefgelaufen, während ich nachgedacht habe. Kannst du es nochmal versuchen?"
voice_retry_prompt: "Das habe ich nicht ganz verstanden. Kannst du das nochmal fragen?"
voice_error_prompt: "Entschuldigung, da ist etwas schiefgelaufen. Kannst du es nochmal versuchen?"
sources_label: "Quellen"
source_line: "[Quelle {id}] Dokument {document_id} - {url}"
truncated_notice: "[...gekürzt für bessere Performance...]"

# Gibt dem Lehrer ein Kurzzeitgedächtnis für frühere Runden derselben
# Sitzung, damit Rückfragen wie "wie funktioniert das?" richtig aufgelöst
# werden. Entfällt komplett, wenn es noch keine vorherige Runde gibt.
conversation_history_label: "BISHERIGES GESPRÄCH"
conversation_learner_label: "Kind"
conversation_tutor_label: "Sparky"

# Spoken forms for fractions, so the voice says "one half" instead of
# "one slash two". Anything not listed uses speech_fraction_template.
speech_fractions:
  "1/2": "ein halb"
  "1/3": "ein Drittel"
  "2/3": "zwei Drittel"
  "1/4": "ein Viertel"
  "3/4": "drei Viertel"
speech_fraction_template: "{numerator} durch {denominator}"

refusal_pattern: "Ich (kann|darf) (dir |Ihnen |dazu )?(keine (Informationen|Anleitung|Anweisungen|Auskunft)|(dabei |dir |Ihnen )?nicht (helfen|weiterhelfen))"
# Experiment sheets mark their most important safety line with this; the tutor always
# adds that line to an answer based on the sheet (see _must_say in simple_rag_service.py)
must_say_marker: "Sparky sagt immer:"
safety_redirect: "Das klingt nach etwas, das richtig gefährlich sein könnte. Bitte probier es nicht aus und sprich mit einem Erwachsenen, dem du vertraust, darüber. Es gibt so viel spannende Wissenschaft, die wir sicher zusammen entdecken können. Was möchtest du sonst noch wissen?"

# Maths helper (core/services/maths_helper.py): sums in the child's message are
# worked out exactly in code and added to the prompt, because small models get
# arithmetic wrong. {fact} is e.g. "1/2 + 1/4 = 3/4 (= 0.75)". maths_check_note
# is used when the child answers the previous sum ("I got two sixths").
maths_note: "MATHE-FAKT (genau ausgerechnet, also vertrau ihm und rechne nicht selbst nach): {fact}. Erkläre einfach, wie man auf diese Antwort kommt."
maths_check_note: "MATHE-CHECK (genau ausgerechnet): Die Antwort des Kindes ist {child}; die richtige Antwort auf {expr} ist {answer}. Das Kind hat {verdict}. Sag es ihm freundlich und hilf ihm zu verstehen, warum."
maths_correct: "recht"
maths_incorrect: "noch nicht recht"
